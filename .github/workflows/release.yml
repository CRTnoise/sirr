name: Release

# Push a tag like v1.1.0 → tests, then Linux (AppImage + .deb) and Windows
# (installer + portable .exe) builds, then one GitHub Release holding the
# binaries, LICENSE, THIRD-PARTY-NOTICES.md and SHA256SUMS.txt.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: |
          npm ci --ignore-scripts
          npm rebuild better-sqlite3
      - run: npm run test:all

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmd: npm run build:linux
          - os: windows-latest
            cmd: npm run build:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm
      - run: npm ci
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Licence and checksums
        run: |
          cp LICENSE out/LICENSE.txt
          cp THIRD-PARTY-NOTICES.md out/
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Sirr ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          body: |
            **Windows:** `Sirr-Setup-*.exe` installs Sirr; `Sirr-*-portable.exe` runs without installing.
            **Linux:** `Sirr-*-x86_64.AppImage` (chmod +x, run) or `Sirr-*-amd64.deb` (`sudo apt install ./Sirr-*-amd64.deb`).
            Builds are not code-signed yet. Check the file against `SHA256SUMS.txt` before running it:
            `sha256sum -c SHA256SUMS.txt --ignore-missing` (Linux) · `certutil -hashfile <file> SHA256` (Windows).
          files: out/*
