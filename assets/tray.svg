    <path d="M14.5 3.5A12.5 12.5 0 0 0 14.5 28.5Z" fill="#e8eaee"/>
    <path d="M17.5 3.5A12.5 12.5 0 0 1 17.5 28.5Z" fill="#4ff0a0"/>
  </g>
</svg>
