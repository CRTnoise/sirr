<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Share — Sirr</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:oklch(0.140 0.007 255);color:oklch(0.810 0.009 255);font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;padding:20px;height:100vh;overflow-y:auto;user-select:none}
  h2{font-size:11.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:oklch(0.915 0.006 255);margin-bottom:16px}
  h2::before{content:'';display:inline-block;width:6px;height:6px;margin-right:10px;background:oklch(0.87 0.17 158);vertical-align:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .it{background:oklch(0.160 0.007 255);border:1px solid oklch(0.262 0.009 255);overflow:hidden;cursor:pointer;transition:border-color .14s}
  .it:hover,.it:focus{outline:none;border-color:oklch(0.87 0.17 158)}
  .it img{width:100%;height:120px;object-fit:cover;background:#000;display:block;pointer-events:none}
  .it .nm{padding:9px 10px;font-size:11.5px;color:oklch(0.710 0.011 255);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;border-top:1px solid oklch(0.262 0.009 255)}
  .bar{display:flex;justify-content:flex-end;margin-top:16px}
  .bar button{background:transparent;border:1px solid oklch(0.375 0.010 255);color:oklch(0.710 0.011 255);padding:10px 18px;cursor:pointer;font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .bar button:hover{border-color:oklch(0.915 0.006 255);color:oklch(0.975 0.004 255)}
  .empty{padding:40px;text-align:center;color:oklch(0.630 0.012 255);font-size:12px}
</style>
</head>
<body>
  <h2>Choose what to share</h2>
  <div class="grid" id="g"></div>
  <div class="bar"><button id="cancel" type="button">Cancel</button></div>
  <script src="picker.js"></script>
</body>
</html>
